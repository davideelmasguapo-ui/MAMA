<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Feliz Cumpleaños Mamá</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            text-align: center;
            color: #fff;
        }

        .container {
            padding: 40px;
        }

        h1 {
            font-size: 3em;
        }

        button {
            background: #fff;
            color: #ff6f91;
            border: none;
            padding: 15px 25px;
            font-size: 1em;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #ffe0e9;
        }

        .mensaje {
            margin-top: 20px;
            font-size: 1.4em;
        }

        .galeria {
            margin-top: 50px;
        }

        .fotos {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .fotos img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid white;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎉 ¡Feliz Cumpleaños Mamá! 🎉</h1>
        <p>Gracias por todo lo que haces por mí 💖</p>

        <button onclick="mostrarMensaje()">Haz clic para un mensaje 💌</button>

        <div class="mensaje" id="mensaje"></div>

        <div class="galeria">
            <h2>📸 Nuestros momentos</h2>
            <div class="fotos">
                <img src="mama1.jpg">
                <img src="mama2.jpg">
                <img src="mama3.jpg">
            </div>
        </div>
    </div>

    <script>
        const mensajes = [
            "Mamá, eres mi persona favorita 💕",
            "Gracias por siempre estar para mí 🫶",
            "Eres la mejor mamá del mundo 🌎",
            "Te amo con todo mi corazón 💖",
            "Gracias por tu amor infinito ✨",
            "Siempre voy a estar para ti 💞"
        ];

        function mostrarMensaje() {
            const random = Math.floor(Math.random() * mensajes.length);
            document.getElementById("mensaje").innerText = mensajes[random];
        }
    </script>
</body>
</html>
